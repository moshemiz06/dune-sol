<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arrakis 3D model</title><style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans,system-ui,sans-serif);color:var(--foreground,#ddd9ca)}.stage{height:540px;position:relative;background:radial-gradient(ellipse at 55% 37%,#2a2d21,#151811);border-radius:var(--radius,8px);padding:16px;overflow:hidden}.canvas{position:absolute;inset:0}.canvas canvas{display:block;touch-action:none;width:100%;height:100%}.toolbar{position:absolute;left:18px;right:18px;top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none;z-index:2}.buttons{display:flex;gap:3px;background:#151911dd;border:1px solid #cdb38235;border-radius:5px;padding:4px;pointer-events:auto;backdrop-filter:blur(10px)}button,select{font:11px var(--font-sans,system-ui);color:#aea991;background:transparent;border:0;border-radius:3px;padding:8px 11px;cursor:pointer}button.active{color:#eee0c2;background:#cbb4891c}button:hover{color:#fff4da}button:focus-visible,select:focus-visible{outline:2px solid #d0b387;outline-offset:2px}.tools{display:flex;gap:6px;pointer-events:auto}.tools select{color:#d3bf9a;background:#1c2118;border:1px solid #cdb38235;font-size:10px;padding:7px}.tools button{background:#1c2118;border:1px solid #cdb38235;font-size:10px}.caption{position:absolute;left:20px;bottom:19px;pointer-events:none;font-size:9px;letter-spacing:.3px;color:#aca88f;line-height:1.7;z-index:2}.caption b{display:block;font-weight:500;font-size:10px;letter-spacing:2px;color:#d7bd90;margin-bottom:4px}.status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1e15;color:#ccaf83;font-size:11px;letter-spacing:2px;z-index:3}.label-layer{position:absolute;inset:0;pointer-events:none}.label{position:absolute;padding:5px 8px;color:#d6c9ae;background:#192016ca;border:1px solid #b4a37a35;font-size:9px;border-radius:3px;white-space:nowrap;text-shadow:0 1px 3px #0005}.label:before{content:"";display:inline-block;vertical-align:middle;width:4px;height:4px;border-radius:50%;background:#d5b785;margin-right:6px}.note{font-size:10px;line-height:1.7;color:var(--muted-foreground,#999);margin:11px 0 0}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#141910cc,transparent 20%)}@media(max-width:450px){.stage{height:440px}.toolbar{left:14px;right:14px;top:14px;gap:6px}.buttons button{font-size:10px;padding:7px 8px}.tools select{font-size:9px;padding:7px 5px}.tools button{font-size:9px;padding:7px}.caption{left:16px;bottom:15px;font-size:8px}.label{font-size:8px;padding:4px 6px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body>
<div class="stage"><div class="canvas" id="canvas"></div><div class="toolbar"><div class="buttons" role="group" aria-label="Model view"><button class="active" id="landscape" aria-pressed="true">Landscape</button><button id="planet" aria-pressed="false">Orbital view</button></div><div class="tools"><select id="light" aria-label="Lighting"><option value="day">Daylight</option><option value="dawn">Dawn</option><option value="dusk">Dusk</option></select><button id="reset" aria-label="Reset camera">Reset ↗</button></div></div><div class="label-layer" id="labels"></div><div class="caption"><b id="caption-title">ARRAKEEN & THE SHIELD WALL</b>Drag to orbit · Scroll or pinch to zoom</div><div class="status" id="status">CHARTING ARRAKIS</div></div>
<p class="note">An artistic interpretation of the opening of <i>Dune</i>, before Paul and Jessica’s escape into the desert. Geography and scale are illustrative.</p>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
function require(name){if(name==='three')return THREE;if(name.includes('BufferGeometryUtils'))return{mergeGeometries};throw Error(name);}
{{ARRAKIS_WORLD}}
try{
const holder=document.getElementById('canvas'),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setClearColor(0,0);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.28;holder.appendChild(renderer.domElement);
renderer.domElement.setAttribute('aria-label','Interactive 3D Arrakis model. Drag to rotate and scroll to zoom.');
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.1,1000),controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.minDistance=22;controls.maxDistance=530;controls.maxPolarAngle=Math.PI*.47;controls.autoRotateSpeed=.35;
const hemi=new THREE.HemisphereLight('#dce0d0','#6a5e4a',1.5);scene.add(hemi);
const sun=new THREE.DirectionalLight('#fff0d5',2.7);sun.position.set(-100,120,80);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);Object.assign(sun.shadow.camera,{left:-145,right:145,top:115,bottom:-115,near:1,far:450});sun.shadow.normalBias=.16;scene.add(sun);
const fill=new THREE.DirectionalLight('#c3cbad',.7);fill.position.set(80,50,-90);scene.add(fill);
const landscape=ArrakisWorld.createLandscape().root,planet=ArrakisWorld.createPlanet();planet.visible=false;scene.add(landscape,planet);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.ShadowMaterial({opacity:.15}));floor.rotation.x=-Math.PI/2;floor.position.y=-5.5;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(300,20,'#abb48a','#abb48a');grid.position.y=-5.6;grid.material.transparent=true;grid.material.opacity=.055;scene.add(grid);
const marks=[['Arrakeen',-24,6,-7],['Atreides residence',-37,11,-14],['Shield Wall',10,23,-44],['Spice crawler',43,6,24]];
const labels=marks.map(m=>{const el=document.createElement('span');el.className='label';el.textContent=m[0];document.getElementById('labels').appendChild(el);return{el,point:new THREE.Vector3(m[1],m[2],m[3])};});
let orbital=false;
function resize(){const w=holder.clientWidth,h=holder.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
function reset(){const factor=camera.aspect<1?.8/camera.aspect+1:1;camera.position.copy(orbital?new THREE.Vector3(100,43,215).multiplyScalar(camera.aspect<1?1.25:1):new THREE.Vector3(173,156,205).multiplyScalar(factor));controls.target.set(0,orbital?0:-2,0);controls.update();}
function lighting(){const value=document.getElementById('light').value;
if(value==='day'){sun.position.set(-100,120,80);sun.color.set('#fff0d5');hemi.intensity=orbital?.4:1.5;renderer.toneMappingExposure=1.28;}
else if(value==='dawn'){sun.position.set(-130,42,60);sun.color.set('#ffc38a');hemi.intensity=orbital?.3:1.2;renderer.toneMappingExposure=1.25;}
else{sun.position.set(100,24,70);sun.color.set('#ee9e69');hemi.intensity=orbital?.25:1.1;renderer.toneMappingExposure=1.08;}fill.intensity=orbital?.1:.7;}
function mode(next){orbital=next;landscape.visible=!next;planet.visible=next;floor.visible=grid.visible=!next;document.getElementById('labels').style.display=next?'none':'block';controls.minDistance=next?80:22;document.getElementById('landscape').classList.toggle('active',!next);document.getElementById('planet').classList.toggle('active',next);document.getElementById('landscape').setAttribute('aria-pressed',!next);document.getElementById('planet').setAttribute('aria-pressed',next);document.getElementById('caption-title').textContent=next?'ARRAKIS & ITS TWO MOONS':'ARRAKEEN & THE SHIELD WALL';lighting();reset();}
document.getElementById('landscape').onclick=()=>mode(false);document.getElementById('planet').onclick=()=>mode(true);document.getElementById('light').onchange=lighting;document.getElementById('reset').onclick=reset;
new ResizeObserver(()=>{resize();reset();}).observe(holder);resize();reset();const p=new THREE.Vector3();
renderer.setAnimationLoop(()=>{controls.update();if(!orbital)for(const label of labels){p.copy(label.point).project(camera);label.el.style.transform='translate('+((p.x+1)*holder.clientWidth/2+5)+'px,'+((1-p.y)*holder.clientHeight/2-23)+'px)';label.el.style.visibility=p.z>1?'hidden':'visible';}renderer.render(scene,camera);});
document.getElementById('status').remove();window.arrakisInline={renderer,scene,camera,controls,landscape,planet};
}catch(e){document.getElementById('status').textContent='Open the downloaded GLB in a 3D viewer to explore.';console.error(e);}
</script></body></html>
